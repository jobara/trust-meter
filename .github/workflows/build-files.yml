name: Convert

on:
  push:
    branches: [main]

jobs:
  convert_via_pandoc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        formats: [docx, pdf, epub, html]
        filenames: [README]

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Convert "${{ matrix.filenames }}.md" to ${{ matrix.formats }}
        uses: docker://pandoc/latex:3.9
        with:
          args: --pdf-engine=typst --output=${{ matrix.filenames }}.${{ matrix.formats }} ${{ matrix.filenames }}.md

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filenames }}.${{ matrix.formats }}
          path: ${{ matrix.filenames }}.${{ matrix.formats }}
